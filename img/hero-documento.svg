<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" role="img" aria-labelledby="t d">
  <title id="t">Documento antes y después de anonimizar</title>
  <desc id="d">Un contrato con datos personales reemplazados por etiquetas como NOMBRE_1, DNI_1 y EMAIL_1.</desc>
  <rect width="560" height="400" fill="#0e1426"/>
  <rect x=".5" y=".5" width="559" height="399" fill="none" stroke="#223052"/>
  <circle cx="28" cy="28" r="5" fill="#f5a623"/>
  <text x="44" y="32" font-family="monospace" font-size="12" fill="#a3adc8" letter-spacing="1.5">ANONIMAX // DOCUMENTO PROCESADO</text>
  <text x="530" y="32" text-anchor="end" font-family="monospace" font-size="12" fill="#34d3a1">● LISTO</text>
  <line x1="0" y1="52" x2="560" y2="52" stroke="#223052"/>

  <rect x="24" y="76" width="512" height="40" fill="#111a30"/><rect x="24" y="76" width="3" height="40" fill="#34d3a1"/>
  <text x="44" y="101" font-family="monospace" font-size="14" fill="#eef1f8">contrato_alquiler.txt</text>
  <text x="516" y="101" text-anchor="end" font-family="monospace" font-size="12" fill="#a3adc8">7 datos ocultos</text>

  <g font-family="monospace" font-size="14" fill="#eef1f8">
    <text x="24" y="156">Entre el Sr.</text>
    <rect x="124" y="140" width="104" height="22" fill="#f5a623"/><text x="132" y="156" fill="#1b1300" font-weight="bold">[NOMBRE_1]</text>
    <text x="236" y="156">, DNI</text>
    <rect x="286" y="140" width="64" height="22" fill="#f5a623"/><text x="294" y="156" fill="#1b1300" font-weight="bold">[DNI_1]</text>

    <text x="24" y="192">con domicilio en</text>
    <rect x="164" y="176" width="120" height="22" fill="#f5a623"/><text x="172" y="192" fill="#1b1300" font-weight="bold">[DOMICILIO_1]</text>
    <text x="292" y="192">, y la</text>

    <text x="24" y="228">señora</text>
    <rect x="86" y="212" width="104" height="22" fill="#f5a623"/><text x="94" y="228" fill="#1b1300" font-weight="bold">[NOMBRE_2]</text>
    <text x="198" y="228">, se conviene:</text>

    <text x="24" y="264">Notificaciones a</text>
    <rect x="164" y="248" width="88" height="22" fill="#f5a623"/><text x="172" y="264" fill="#1b1300" font-weight="bold">[EMAIL_1]</text>
    <text x="260" y="264">o al</text>
    <rect x="296" y="248" width="104" height="22" fill="#f5a623"/><text x="304" y="264" fill="#1b1300" font-weight="bold">[TELEFONO_1]</text>

    <text x="24" y="300">Cuenta para el pago:</text>
    <rect x="204" y="284" width="104" height="22" fill="#f5a623"/><text x="212" y="300" fill="#1b1300" font-weight="bold">[CUENTA_1]</text>
  </g>

  <rect x="24" y="332" width="512" height="44" fill="#080c18" stroke="#223052"/>
  <text x="44" y="359" font-family="monospace" font-size="12" fill="#a3adc8" letter-spacing="1">PROCESADO EN TU NAVEGADOR · NADA SE SUBE A INTERNET</text>
</svg>
